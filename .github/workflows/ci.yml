name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wpf:
    name: WPF build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build TokenView
        run: dotnet build wpf/TokenView.Wpf/TokenView.Wpf.csproj -c Release
      - name: Build Probe
        run: dotnet build wpf/TokenView.Probe/TokenView.Probe.csproj -c Release
      - name: Test
        run: dotnet test wpf/TokenView.Tests/TokenView.Tests.csproj -c Release
